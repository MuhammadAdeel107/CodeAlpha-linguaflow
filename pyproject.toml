[project]
name = "linguaflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Muhammad Adeel Arshad", email = "adeelarshad1155@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "google-cloud-translate>=3.27.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
linguaflow = "linguaflow:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
